<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prenota il tuo taglio</title>
</head>
<body>
  <h1>Prenota il tuo taglio a domicilio</h1>

  <form id="ricerca">
    <label>Indirizzo<br>
      <input type="text" id="indirizzo" placeholder="Via Roma 10, Thiene" required>
    </label><br><br>
    <label>Data<br>
      <input type="date" id="data" required>
    </label><br><br>
    <button type="submit">Vedi orari disponibili</button>
  </form>

  <div id="risultati"></div>
</body>
</html>
